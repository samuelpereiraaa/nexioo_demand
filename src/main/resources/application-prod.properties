# ─────────────────────────────────────────────
# Nexioo Demand — Configurações de Produção
# ─────────────────────────────────────────────

# Cache de templates habilitado para máxima performance em produção
spring.thymeleaf.cache=true

# Logs concisos em produção (sem tokens ou dados sensíveis)
logging.level.br.com.nexioo=INFO
logging.level.org.springframework.web=WARN

# Suporte seguro a proxies reversos confiáveis (Vercel / Cloudflare / Nginx)
server.forward-headers-strategy=framework

# Supabase Auth & PostgREST — estritamente requeridos via variáveis de ambiente (falha na inicialização se ausentes)
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
