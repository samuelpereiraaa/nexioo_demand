# ─────────────────────────────────────────────
# Nexioo Demand — Configurações base
# ─────────────────────────────────────────────

# Servidor
spring.application.name=nexioo-demand
spring.profiles.default=dev-memory
server.port=${PORT:8080}

# Suporte seguro a proxies reversos (trata Forwarded / X-Forwarded-* de forma padronizada pelo framework)
server.forward-headers-strategy=framework

# Thymeleaf
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Encoding HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Log da aplicação
logging.level.br.com.nexioo=DEBUG
logging.level.org.springframework.web=INFO

# Mensagens de validação em pt-BR
spring.messages.encoding=UTF-8

# Limites para upload de arquivos e imagens (até 20MB)
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Supabase Auth & PostgREST (propriedades declaradas sem fallbacks reais sensíveis)
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
