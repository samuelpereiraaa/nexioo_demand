<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<!-- Fragmento Thymeleaf do Conteúdo do Modal de Detalhes da Demanda -->
<div th:fragment="modalDetalheConteudo" class="modal-detail-card" th:attr="data-id=${demanda.id}">

    <!-- ── Barra Superior do Modal ────────────────────────────────────────── -->
    <div class="modal-detail-header-bar">
        <div class="modal-detail-header-left">
            <!-- Dropdown / Badge de Lista / Status -->
            <div class="status-badge-dropdown-wrapper">
                <form method="post" th:action="@{/demandas/{id}/status(id=${demanda.id})}" class="modal-status-form">
                    <select name="coluna"
                            id="modal-detail-coluna-select"
                            class="status-badge-select"
                            onchange="window.salvarColunaModal(this.form)"
                            aria-label="Alterar coluna da demanda">
                        <option th:each="c : ${colunas}"
                                th:value="${c.id}"
                                th:text="${c.descricao}"
                                th:selected="${demanda.coluna != null and c.id == demanda.coluna.id}">
                        </option>
                    </select>
                </form>
            </div>
        </div>

        <div class="modal-detail-header-right">
            <!-- Botão Acompanhar Demanda -->
            <button type="button"
                    class="btn-track-demand"
                    th:classappend="${demanda.acompanhando} ? ' is-tracking' : ''"
                    onclick="window.toggleAcompanharModal()"
                    title="Acompanhar demanda">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span th:text="${demanda.acompanhando} ? 'Acompanhando' : 'Acompanhar'">Acompanhar</span>
            </button>

            <!-- Botão de Fechar Modal -->
            <button type="button"
                    class="btn-close-modal-detail"
                    id="btn-fechar-modal-detalhe"
                    data-close-modal-detail
                    aria-label="Fechar detalhes da demanda"
                    title="Fechar (Escape)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- ── Corpo do Modal: Layout em 2 Colunas ──────────────────────────── -->
    <div class="modal-detail-body">

        <!-- ── Coluna Esquerda (Principal) ────────────────────────────────── -->
        <div class="modal-detail-main-col">

            <!-- Linha do Título com Checkbox Circular de Conclusão -->
            <div class="modal-detail-title-row">
                <form method="post"
                      th:action="@{/demandas/{id}/toggle-concluido(id=${demanda.id})}"
                      class="modal-toggle-form">
                    <button type="button"
                            class="btn-card-complete modal-complete-circle"
                            th:classappend="${demanda.coluna != null and demanda.coluna.id == 'CONCLUIDO'} ? ' is-completed' : ''"
                            onclick="window.toggleConcluidoModal(this.form)"
                            title="Alternar conclusão">
                        <svg class="icon-circle-uncompleted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="9"></circle>
                        </svg>
                        <svg class="icon-circle-completed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </button>
                </form>

                <div class="title-input-wrapper">
                    <input type="text"
                           id="modal-input-titulo"
                           class="modal-detail-title-input"
                           th:value="${demanda.titulo}"
                           placeholder="Título da demanda"
                           maxlength="120"
                           aria-label="Título da demanda"
                           onblur="window.salvarTituloModal(this.value)">
                </div>
            </div>

            <!-- Linha de Botões de Ação Rápida e Atalhos -->
            <div class="modal-quick-props-row">

                <!-- Botão Agrupador "Adicionar" -->
                <div class="popover-wrapper">
                    <button type="button" class="prop-pill" onclick="window.togglePopover('popover-adicionar')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Adicionar ▾</span>
                    </button>
                    <div id="popover-adicionar" class="popover-menu is-hidden">
                        <button type="button" class="popover-item" onclick="window.openPopoverMenu('popover-etiquetas')">🏷️ Etiquetas</button>
                        <button type="button" class="popover-item" onclick="window.openPopoverMenu('popover-datas')">📅 Datas</button>
                        <button type="button" class="popover-item" onclick="window.openPopoverMenu('popover-checklist')">☑️ Checklist</button>
                        <button type="button" class="popover-item" onclick="window.openPopoverMenu('popover-membros')">👤 Membros</button>
                    </div>
                </div>

                <!-- Seletor de Etiquetas -->
                <div class="popover-wrapper">
                    <button type="button" class="prop-pill" onclick="window.togglePopover('popover-etiquetas')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                        </svg>
                        <span>Etiquetas</span>
                    </button>
                    <div id="popover-etiquetas" class="popover-menu is-hidden">
                        <div class="popover-title">Etiquetas</div>
                        <div class="popover-options-list">
                            <button type="button" class="tag-opt-btn tag--green" onclick="window.adicionarEtiquetaModal('Frontend', '#00E6A8')">Frontend</button>
                            <button type="button" class="tag-opt-btn tag--blue" onclick="window.adicionarEtiquetaModal('Backend', '#3B82F6')">Backend</button>
                            <button type="button" class="tag-opt-btn tag--pink" onclick="window.adicionarEtiquetaModal('Design', '#EC4899')">Design</button>
                            <button type="button" class="tag-opt-btn tag--red" onclick="window.adicionarEtiquetaModal('Urgente', '#EF4444')">Urgente</button>
                            <button type="button" class="tag-opt-btn tag--purple" onclick="window.adicionarEtiquetaModal('Infra', '#8B5CF6')">Infra</button>
                        </div>
                    </div>
                </div>

                <!-- Seletor de Datas -->
                <div class="popover-wrapper">
                    <button type="button" class="prop-pill" onclick="window.togglePopover('popover-datas')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span th:text="${demanda.prazo != null} ? ${#temporals.format(demanda.prazo, 'dd/MM/yyyy')} : 'Datas'">Datas</span>
                    </button>
                    <div id="popover-datas" class="popover-menu is-hidden">
                        <div class="popover-title">Prazo de entrega</div>
                        <input type="date"
                               id="input-modal-prazo"
                               class="popover-input-date"
                               th:value="${demanda.prazo}"
                               onchange="window.salvarPrazoModal(this.value)">
                        <button th:if="${demanda.prazo != null}" type="button" class="btn btn-perigo-dark btn-sm full-w mt-8" onclick="window.salvarPrazoModal('')">Remover prazo</button>
                    </div>
                </div>

                <!-- Botão Criar Checklist -->
                <div class="popover-wrapper">
                    <button type="button" class="prop-pill" onclick="window.togglePopover('popover-checklist')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        <span>Checklist</span>
                    </button>
                    <div id="popover-checklist" class="popover-menu is-hidden">
                        <div class="popover-title">Adicionar checklist</div>
                        <input type="text" id="input-titulo-checklist" class="popover-input-text" placeholder="Título da checklist" value="Checklist">
                        <button type="button" class="btn btn-primario-destaque btn-sm full-w mt-8" onclick="window.adicionarChecklistModal()">Adicionar</button>
                    </div>
                </div>

                <!-- Seletor de Membros -->
                <div class="popover-wrapper">
                    <button type="button" class="prop-pill" onclick="window.togglePopover('popover-membros')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Membros</span>
                    </button>
                    <div id="popover-membros" class="popover-menu is-hidden">
                        <div class="popover-title">Membros</div>
                        <div class="popover-options-list">
                            <button type="button"
                                    th:each="m : ${membrosSugeridos}"
                                    class="popover-item"
                                    th:text="${m}"
                                    th:onclick="'window.adicionarMembroModal(\'' + ${m} + '\')'">
                                Samuel Oliveira
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Seletor de Prioridade -->
                <div class="prop-pill-dropdown">
                    <button type="button" class="prop-pill" title="Prioridade">
                        <span th:text="'Prioridade: ' + ${demanda.prioridade.descricao}">Prioridade</span>
                    </button>
                    <select id="modal-prop-prioridade" class="prop-pill-select" onchange="window.salvarCamposModal()">
                        <option th:each="p : ${prioridades}"
                                th:value="${p}"
                                th:text="${p.descricao}"
                                th:selected="${p == demanda.prioridade}">
                        </option>
                    </select>
                </div>

            </div>

            <!-- Exibição de Etiquetas Aplicadas -->
            <div th:if="${!#lists.isEmpty(demanda.etiquetas)}" class="tags-badges-row">
                <span th:each="tag : ${demanda.etiquetas}"
                      class="applied-tag-badge"
                      th:style="'background-color:' + ${tag.corHex} + '22; border-color:' + ${tag.corHex} + '; color:' + ${tag.corHex} + ';'">
                    <span th:text="${tag.nome}">Frontend</span>
                    <button type="button" class="btn-remove-tag" th:onclick="'window.removerEtiquetaModal(\'' + ${tag.id} + '\')'">✕</button>
                </span>
            </div>

            <!-- Exibição de Membros Responsáveis -->
            <div th:if="${!#lists.isEmpty(demanda.membros)}" class="members-badges-row">
                <span class="members-label">Membros:</span>
                <span th:each="mb : ${demanda.membros}" class="member-chip">
                    <span th:text="${mb}">Samuel Oliveira</span>
                    <button type="button" class="btn-remove-chip" th:onclick="'window.removerMembroModal(\'' + ${mb} + '\')'">✕</button>
                </span>
            </div>

            <!-- ── Seção Descrição Formatada ──────────────────────────────── -->
            <div class="modal-section-box">
                <div class="modal-section-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="21" y1="10" x2="3" y2="10"></line>
                        <line x1="21" y1="6" x2="3" y2="6"></line>
                        <line x1="21" y1="14" x2="3" y2="14"></line>
                        <line x1="21" y1="18" x2="3" y2="18"></line>
                    </svg>
                    <h2 class="modal-section-title">Descrição</h2>
                </div>

                <!-- Visualização estática ou Editor formatado -->
                <div class="modal-editor-container" id="editor-descricao-wrapper">
                    <div class="modal-editor-toolbar">
                        <button type="button" class="tb-btn" onclick="window.inserirFormatacao('bold')" title="Negrito"><strong>B</strong></button>
                        <button type="button" class="tb-btn" onclick="window.inserirFormatacao('italic')" title="Itálico"><em>I</em></button>
                        <button type="button" class="tb-btn" onclick="window.inserirFormatacao('list')" title="Lista">• Lista</button>
                        <button type="button" class="tb-btn" onclick="window.inserirFormatacao('link')" title="Link">🔗 Link</button>
                    </div>

                    <textarea id="modal-textarea-descricao"
                              class="modal-editor-textarea"
                              rows="4"
                              placeholder="Adicione uma descrição mais detalhada..."
                              th:text="${demanda.descricao}"></textarea>

                    <div class="modal-editor-actions">
                        <button type="button"
                                class="btn btn-primario-destaque btn-sm"
                                id="btn-salvar-descricao"
                                onclick="window.salvarDescricaoModal()">
                            Salvar
                        </button>
                        <button type="button"
                                class="btn btn-fantasma btn-sm"
                                id="btn-cancelar-descricao"
                                onclick="window.restaurarDescricaoModal()">
                            Cancelar
                        </button>
                    </div>
                </div>
            </div>

            <!-- ── Seção Checklists ───────────────────────────────────────── -->
            <div th:each="chk : ${demanda.checklists}" class="modal-section-box checklist-box">
                <div class="modal-section-header flex-between">
                    <div class="modal-section-title-group">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        <h3 class="modal-section-title" th:text="${chk.titulo}">Checklist</h3>
                    </div>
                    <button type="button" class="btn-subtle-sm danger-text" th:onclick="'window.removerChecklistModal(' + ${chk.id} + ')'">Excluir</button>
                </div>

                <!-- Barra de Progresso -->
                <div class="checklist-progress-wrapper">
                    <span class="checklist-progress-text" th:text="${chk.progressoTexto}">0/0</span>
                    <div class="checklist-progress-bar">
                        <div class="checklist-progress-fill" th:style="'width:' + ${chk.progressoPercentual} + '%;'"></div>
                    </div>
                </div>

                <!-- Lista de Itens -->
                <div class="checklist-items-list">
                    <div th:each="item : ${chk.itens}" class="checklist-item-row">
                        <input type="checkbox"
                               class="chk-item-checkbox"
                               th:checked="${item.concluido}"
                               th:onchange="'window.toggleChecklistItemModal(' + ${chk.id} + ',' + ${item.id} + ')'">
                        <span class="chk-item-text"
                              th:classappend="${item.concluido} ? ' is-done' : ''"
                              th:text="${item.texto}">Item da checklist</span>
                        <button type="button" class="btn-remove-item" th:onclick="'window.removerChecklistItemModal(' + ${chk.id} + ',' + ${item.id} + ')'">✕</button>
                    </div>
                </div>

                <!-- Form Adicionar Item -->
                <div class="add-checklist-item-form">
                    <input type="text" th:id="'input-item-chk-' + ${chk.id}" class="chk-item-input" placeholder="Adicionar um item..." onkeydown="if(event.key==='Enter'){window.adicionarItemChecklistModal(this, [[${chk.id}]]);}"/>
                    <button type="button" class="btn btn-primario-destaque btn-sm" th:onclick="'window.adicionarItemChecklistModal(document.getElementById(\'input-item-chk-' + ${chk.id} + '\'), ' + ${chk.id} + ')'">Adicionar</button>
                </div>
            </div>

        </div>

        <!-- ── Coluna Direita (Atividade e Comentários) ────────────────── -->
        <div class="modal-detail-sidebar-col">

            <div class="modal-section-box">
                <div class="modal-section-header flex-between">
                    <div class="modal-section-title-group">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <h2 class="modal-section-title">Comentários e atividade</h2>
                    </div>
                    <button type="button"
                            class="btn-subtle-sm"
                            id="btn-toggle-detalhes-atividade"
                            onclick="window.toggleMostrarDetalhesAtividade()">
                        Mostrar Detalhes
                    </button>
                </div>

                <!-- Campo para Escrever Comentário -->
                <div class="comment-editor-box">
                    <textarea id="input-novo-comentario"
                              class="comment-input-field"
                              rows="2"
                              placeholder="Escrever um comentário..."
                              oninput="window.validarBotaoComentario(this)"></textarea>
                    <div class="comment-editor-actions">
                        <button type="button"
                                class="btn btn-primario-destaque btn-sm"
                                id="btn-salvar-comentario"
                                disabled
                                onclick="window.enviarComentarioModal()">
                            Salvar
                        </button>
                    </div>
                </div>

                <!-- Histórico de Atividades e Comentários -->
                <div class="activity-timeline" id="modal-activity-list">
                    <th:block th:each="act : ${demanda.atividades}">
                        <div class="activity-item" th:classappend="${act.comentario} ? ' is-comment-item' : ' is-system-activity'">
                            <div class="card-assignee-avatar avatar-sm avatar-theme--0">
                                <span th:text="${act.iniciaisAutor}">SO</span>
                            </div>
                            <div class="activity-content">
                                <p class="activity-text">
                                    <strong th:text="${act.autor}">Samuel Oliveira</strong>
                                    <span th:text="${act.texto}">adicionou este cartão</span>
                                </p>
                                <span class="activity-time" th:text="${#temporals.format(act.dataHora, 'HH:mm - dd/MM')}">há alguns minutos</span>
                            </div>
                        </div>
                    </th:block>
                    <div th:if="${#lists.isEmpty(demanda.atividades)}" class="activity-empty">
                        <span>Nenhuma atividade registrada ainda.</span>
                    </div>
                </div>
            </div>

            <!-- Painel de Exclusão -->
            <div class="modal-sidebar-actions-panel">
                <button type="button"
                        class="btn btn-perigo-dark btn-full"
                        id="btn-excluir-demanda-modal"
                        onclick="window.confirmarExclusaoModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>Excluir demanda</span>
                </button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
