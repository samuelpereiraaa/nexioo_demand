<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<header th:fragment="topbar" class="topbar" role="banner">
    <div class="topbar-inner">

        <!-- ── Lado Esquerdo: Marca Monograma e Título do Quadro ───────────── -->
        <div class="topbar-left">
            <a th:href="@{/projetos}" class="brand" aria-label="Nexioo Demand — Ir para os projetos">
                <span class="brand-icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>
                        <rect x="10" y="4" width="4" height="11" rx="1.5" fill="currentColor" fill-opacity="0.85"/>
                        <rect x="17" y="4" width="4" height="6" rx="1.5" fill="currentColor" fill-opacity="0.6"/>
                    </svg>
                </span>
                <span class="brand-text">Nexioo Demand</span>
            </a>

            <div class="board-title-badge" role="heading" aria-level="1">
                <span class="board-title-text" th:text="${projetoAtual != null ? projetoAtual.nome : 'Quadro de demandas'}">Quadro de demandas</span>
            </div>
        </div>

        <!-- ── Lado Direito: Avatar ─── -->
        <div class="topbar-right">

            <!-- Avatar do Usuário Dinâmico -->
            <div class="user-avatar-wrapper" th:title="'Usuário logado: ' + ${usuarioLogadoNome}">
                <div class="user-avatar" th:attr="aria-label='Perfil do usuário: ' + ${usuarioIniciais}">
                    <span th:text="${usuarioIniciais}">SP</span>
                </div>
            </div>

            <!-- Botão Sair Sofisticado em Preto -->
            <button type="button" id="btn-topbar-auth" class="btn-topbar-logout" data-logged="true" title="Sair do sistema">
                Sair
            </button>




        </div>

    </div>
</header>

</body>
</html>
