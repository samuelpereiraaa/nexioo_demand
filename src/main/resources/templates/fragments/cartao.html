<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<!--
  Fragmento principal do cartão de demanda.
  Layout compacto, horizontal — controle circular para marcar/desmarcar, editar e excluir cartão.
-->
<section th:fragment="cartao"
         class="kanban-card"
         th:classappend="${demanda.concluido} ? ' card--completed' : ''"
         th:id="'card-' + ${demanda.id}"
         th:attr="data-id=${demanda.id},
                  data-coluna=${demanda.coluna != null ? demanda.coluna.id : ''},
                  aria-label='Demanda: ' + ${demanda.titulo}"
         tabindex="0"
         role="button">

    <!-- ── Capa do cartão (imagem anexada fixada no topo) ── -->
    <div th:if="${demanda.imagemUrl != null and !demanda.imagemUrl.isBlank()}"
         class="card-cover-wrapper"
         th:attr="data-cover-url=${demanda.imagemUrl}, data-cover-title=${demanda.titulo}"
         onclick="event.stopPropagation(); window.abrirVisualizadorImagem(this.getAttribute('data-cover-url'), this.getAttribute('data-cover-title') || 'Capa', null);">
        <img th:src="${demanda.imagemUrl}" alt="Capa da demanda" class="card-cover-image" style="cursor: pointer;" />
    </div>


    <!-- ── Conteúdo principal do cartão ── -->
    <div class="card-main-content">
        <!-- Indicador de prioridade: borda esquerda colorida -->
        <span th:class="'card-priority-indicator priority-indicator--' + ${demanda.prioridade.name().toLowerCase()}"
              aria-hidden="true"></span>

        <!-- ── Controle circular de conclusão: marcar (◯) e desmarcar (✔) ── -->
        <form method="post"
              th:action="@{/demandas/{id}/toggle-concluido(id=${demanda.id})}"
              class="card-complete-form"
              onclick="event.stopPropagation();">
            <button type="button"
                    class="btn-card-complete"
                    th:classappend="${demanda.concluido} ? ' is-completed' : ''"
                    th:attr="title=${demanda.concluido} ? 'Desmarcar demanda' : 'Marcar demanda',
                             aria-label=${demanda.concluido} ? 'Desmarcar demanda' : 'Marcar demanda'"
                    onclick="window.toggleConcluidoCard(this.form)">

                <!-- Ícone 1: círculo vazio (marcar) -->
                <svg class="icon-circle-uncompleted" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                </svg>
                <!-- Ícone 2: check verde preenchido (desmarcar — Imagem 1) -->
                <svg class="icon-circle-completed" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" fill="#70B538"></circle>
                    <path d="M8 12.5L10.5 15L16 9.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </button>
        </form>

        <!-- ── Corpo do cartão ── -->
        <div class="card-body">
            <p class="card-title" th:text="${demanda.titulo}">Título da Demanda</p>

            <!-- Metadados compactos (etiquetas, prazo, checklist, anexos, membros) -->
            <div class="card-meta-row" th:if="${(demanda.etiquetas != null and !demanda.etiquetas.isEmpty()) or demanda.prazo != null or demanda.hasChecklist() or (demanda.descricao != null and !demanda.descricao.isBlank()) or demanda.hasImagem() or (demanda.membros != null and !demanda.membros.isEmpty())}">

                <!-- Etiquetas -->
                <span th:each="tag : ${demanda.etiquetas}"
                      class="card-mini-tag"
                      th:style="'color:' + ${tag.corHex} + '; border-color:' + ${tag.corHex} + '; background:' + ${tag.corHex} + '1a;'"
                      th:text="${tag.nome}">Tag</span>

                <!-- Prazo / Data -->
                <span th:if="${demanda.prazo != null}"
                      class="card-badge card-badge--date"
                      th:classappend="${demanda.isPrazoVencido()} ? ' card-badge--expired' : ''"
                      th:title="${demanda.isPrazoVencido()} ? 'Prazo vencido' : 'Prazo de entrega'">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span th:text="${#temporals.format(demanda.prazo, 'dd/MM')}">12/05</span>
                </span>

                <!-- Indicador de Descrição -->
                <span th:if="${demanda.descricao != null and !demanda.descricao.isBlank()}"
                      class="card-badge"
                      title="Possui descrição detalhada"
                      style="color: var(--color-text-muted);">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="21" y1="10" x2="3" y2="10"></line>
                        <line x1="21" y1="6" x2="3" y2="6"></line>
                        <line x1="21" y1="14" x2="3" y2="14"></line>
                        <line x1="21" y1="18" x2="3" y2="18"></line>
                    </svg>
                </span>

                <!-- Checklist -->
                <span th:if="${demanda.hasChecklist()}"
                      class="card-badge card-badge--checklist"
                      th:title="'Checklist: ' + ${demanda.checklistProgressoTexto}">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    <span th:text="${demanda.checklistProgressoTexto}">0/0</span>
                </span>

                <!-- Anexos (estilo Trello) -->
                <span th:if="${demanda.hasAnexos()}"
                      class="card-badge"
                      th:title="'Anexos: ' + ${demanda.quantidadeAnexos}"
                      style="color: var(--color-text-muted);">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                    <span th:text="${demanda.quantidadeAnexos}">1</span>
                </span>


                <!-- Membros / Responsáveis -->
                <span th:each="mb : ${demanda.membros}"
                      class="card-assignee-avatar avatar-theme--0"
                      th:title="${mb}">
                    <span th:text="${#strings.substring(mb, 0, 2).toUpperCase()}">SO</span>
                </span>

            </div>
        </div>


        <!-- ── Grupo de Ações Rápidas no Hover (Imagens 2 e 3) ── -->
        <div class="card-actions-quick-group">
            <!-- Ícone 1: Excluir/Arquivar demanda (caixa de arquivo — Imagem 3) -->
            <button type="button"
                    class="btn-card-action-circle btn-card-delete"
                    title="Excluir demanda"
                    th:attr="aria-label='Excluir demanda: ' + ${demanda.titulo},
                             data-id=${demanda.id}"
                    onclick="event.stopPropagation(); window.excluirDemanda(this);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 8v13H3V8"></path>
                    <path d="M1 3h22v5H1z"></path>
                    <path d="M10 12h4"></path>
                </svg>
            </button>

            <!-- Ícone 2: Editar / Detalhes da demanda (lápis) -->
            <button type="button"
                    class="btn-card-action-circle btn-card-quick-edit"
                    title="Editar detalhes"
                    th:attr="aria-label='Editar detalhes: ' + ${demanda.titulo},
                             data-id=${demanda.id}"
                    onclick="event.stopPropagation(); window.iniciarEdicaoRapidaCard(this);">

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </button>

            <!-- Ícone 3: Abrir cartão (modal de detalhes) -->
            <button type="button"
                    class="btn-card-action-circle btn-card-open-modal"
                    title="Abrir cartão"
                    th:attr="aria-label='Abrir cartão: ' + ${demanda.titulo},
                             data-id=${demanda.id}"
                    onclick="event.stopPropagation(); window.abrirModalDetalheDemandas(this);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                    <line x1="7" y1="8" x2="17" y2="8"></line>
                    <line x1="7" y1="12" x2="17" y2="12"></line>
                </svg>
            </button>
        </div>
    </div>



    <!-- ── Editor rápido inline do título ── -->
    <div class="card-quick-edit-editor" style="display: none;" onclick="event.stopPropagation();">
        <textarea class="card-quick-edit-input"
                  rows="3"
                  maxlength="200"
                  aria-label="Editar título da demanda"></textarea>
        <div class="card-quick-edit-actions">
            <button type="button" class="btn-quick-edit-save">Salvar</button>
            <button type="button"
                    class="btn-quick-edit-open-modal"
                    th:attr="data-id=${demanda.id}"
                    onclick="event.stopPropagation(); window.abrirModalDetalheDemandas(this);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                    <line x1="7" y1="8" x2="17" y2="8"></line>
                    <line x1="7" y1="12" x2="17" y2="12"></line>
                </svg>
                <span>Abrir cartão</span>
            </button>
        </div>
    </div>

</section>

<!-- Fragmento auxiliar: cartão vazio -->
<div th:fragment="cartao-vazio" style="display:none"></div>

</body>
</html>
