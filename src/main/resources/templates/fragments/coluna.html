<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<!-- Fragmento da Coluna Kanban -->
<section th:fragment="coluna(coluna, listaDemandas)"
         class="kanban-column"
         th:id="'coluna-' + ${coluna.id.toLowerCase()}"
         th:attr="data-coluna-id=${coluna.id}, aria-label='Coluna ' + ${coluna.descricao}">

    <!-- ── Cabeçalho ── -->
    <header class="column-header">
        <div class="column-title-group">
            <h2 class="column-title" th:text="${coluna.descricao}">Backlog</h2>
            <span class="column-count"
                  th:text="${#lists.size(listaDemandas)}"
                  th:attr="aria-label='Total de ' + ${#lists.size(listaDemandas)} + ' demandas'">0</span>
        </div>

        <div class="column-actions">
            <button type="button"
                    class="btn-column-collapse"
                    data-action="toggle-collapse-coluna"
                    aria-label="Recolher coluna"
                    title="Recolher coluna">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="4 14 10 14 10 20"></polyline>
                    <polyline points="20 10 14 10 14 4"></polyline>
                </svg>
            </button>

            <div class="column-options-wrapper">
                <button type="button"
                        class="btn-column-menu"
                        data-action="toggle-column-menu"
                        aria-expanded="false"
                        th:attr="aria-label='Opções da coluna ' + ${coluna.descricao},
                                 title='Opções da coluna ' + ${coluna.descricao}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                        <circle cx="19" cy="12" r="1.5" fill="currentColor"></circle>
                        <circle cx="5" cy="12" r="1.5" fill="currentColor"></circle>
                    </svg>
                </button>
                <div class="column-options-menu is-hidden" role="menu">
                    <button type="button"
                            role="menuitem"
                            class="btn-open-compositor"
                            th:attr="aria-label='Adicionar cartão em ' + ${coluna.descricao}">
                        Adicionar demanda
                    </button>
                    <button type="button"
                            role="menuitem"
                            data-action="toggle-collapse-coluna">
                        Recolher lista
                    </button>
                    <button type="button"
                            role="menuitem"
                            class="btn-delete-column"
                            th:attr="data-column-id=${coluna.id}"
                            onclick="window.excluirLista(this.dataset.columnId)">
                        Excluir lista
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- ── Cabeçalho vertical (coluna recolhida) ── -->
    <div class="column-collapsed-view" aria-hidden="true">
        <button type="button"
                class="btn-column-expand"
                data-action="toggle-collapse-coluna"
                title="Expandir coluna"
                aria-label="Expandir coluna">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
        </button>
        <span class="collapsed-title" th:text="${coluna.descricao}">Backlog</span>
        <span class="collapsed-count" th:text="${#lists.size(listaDemandas)}">0</span>
    </div>

    <!-- ── Lista de cartões ── -->
    <div class="column-cards-list" th:attr="aria-label='Cartões em ' + ${coluna.descricao}">
        <th:block th:each="demanda : ${listaDemandas}">
            <div th:replace="~{fragments/cartao :: cartao}"></div>
        </th:block>

        <div th:if="${#lists.isEmpty(listaDemandas)}" class="column-empty-state">
            <span class="empty-state-text">Nenhuma demanda</span>
        </div>
    </div>

    <!-- ── Rodapé: botão "Adicionar um cartão" + compositor inline ── -->
    <footer class="column-footer"
            th:attr="data-coluna-id=${coluna.id}">

        <!-- Estado 1: Botão (padrão) -->
        <div class="card-composer-trigger">
            <button type="button"
                    class="btn-add-card btn-open-compositor"
                    th:attr="aria-label='Adicionar cartão em ' + ${coluna.descricao},
                             title='Adicionar cartão'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Adicionar um cartão</span>
            </button>
        </div>

        <!-- Estado 2: Compositor (oculto por padrão, CSS controla via classe) -->
        <div class="card-composer" aria-hidden="true">
            <label class="sr-only">Título do novo cartão</label>
            <textarea class="card-composer-input"
                      placeholder="Insira um título ou cole um link"
                      rows="2"
                      maxlength="200"
                      aria-label="Título do novo cartão"
                      aria-required="true"
                      aria-describedby=""></textarea>
            <span class="card-composer-error" role="alert" aria-live="polite"></span>
            <div class="card-composer-actions">
                <button type="button" class="btn-compositor-submit">Adicionar Cartão</button>
                <button type="button"
                        class="btn-compositor-cancel"
                        aria-label="Cancelar adição de cartão">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

    </footer>


</section>

</body>
</html>
