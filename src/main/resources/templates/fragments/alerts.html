<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<div th:fragment="alerts" class="alerts-container">
    <!-- Alerta de Sucesso -->
    <div th:if="${mensagemSucesso}"
         class="toast-alert toast--success"
         role="alert"
         aria-live="polite">
        <span class="toast-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </span>
        <span class="toast-message" th:text="${mensagemSucesso}">Operação realizada com sucesso.</span>
        <button class="toast-close"
                type="button"
                aria-label="Fechar mensagem"
                onclick="this.parentElement.remove()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- Alerta de Erro -->
    <div th:if="${mensagemErro}"
         class="toast-alert toast--error"
         role="alert"
         aria-live="assertive">
        <span class="toast-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </span>
        <span class="toast-message" th:text="${mensagemErro}">Ocorreu um erro.</span>
        <button class="toast-close"
                type="button"
                aria-label="Fechar mensagem"
                onclick="this.parentElement.remove()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>
</div>

</body>
</html>
