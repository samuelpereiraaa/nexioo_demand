<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${titulo})}"></head>
<body class="body-subpage-view">

<a class="skip-to-content" href="#conteudo-erro">Pular para o conteúdo principal</a>

<div th:replace="~{fragments/header :: topbar}"></div>

<main id="conteudo-erro" class="subpage-canvas" role="main">
    <div class="subpage-container container--narrow">
        <div class="glass-dialog-card">
            <div class="dialog-icon-subtle" aria-hidden="true">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </div>
            <h1 class="dialog-title" th:text="${titulo}">Página não encontrada</h1>
            <p class="dialog-text" th:text="${mensagem}">Não foi possível encontrar a informação solicitada.</p>
            <div class="dialog-actions">
                <a th:href="@{/}" class="btn btn-primario-destaque">Voltar ao quadro</a>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
