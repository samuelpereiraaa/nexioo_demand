<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quadro de Demandas')}"></head>
<body class="body-board-view">

<!-- Link acessível para pular direto ao conteúdo principal -->
<a class="skip-to-content" href="#conteudo-quadro">Pular para o quadro de demandas</a>

<!-- Barra Superior Escura Translúcida -->
<div th:replace="~{fragments/header :: topbar}"></div>

<!-- Container Principal do Quadro Kanban -->
<main id="conteudo-quadro" class="board-canvas" role="main">

    <!-- Container de Alertas / Notificações Toast -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Indicador de Filtro Ativo (se houver pesquisa aplicada) -->
    <div th:if="${temFiltro}" class="filter-indicator-bar" role="status">
        <span class="filter-indicator-text">
            Filtro ativo:
            <strong th:if="${filtroTermo != null and !#strings.isEmpty(filtroTermo)}" th:text="'«' + ${filtroTermo} + '»'">termo</strong>
        </span>
        <a th:href="@{/}" class="btn-clear-filter" aria-label="Remover filtros e exibir todas as demandas">
            ✕ Limpar filtro
        </a>
    </div>

    <!-- ── Lista Horizontal de Colunas Kanban ────────────────────────── -->
    <div class="board-columns-track" id="board-columns-track" aria-label="Colunas do Quadro Kanban">

        <!-- Itera sobre as colunas usando o fragmento coluna -->
        <th:block th:each="coluna : ${colunas}">
            <div th:replace="~{fragments/coluna :: coluna(${coluna}, ${demandas.get(coluna) != null ? demandas.get(coluna) : {}})}"></div>
        </th:block>

        <!-- Botão "Adicionar outra lista" (visual only, sem funcionalidade por enquanto) -->
        <div style="flex: 0 0 272px; display: flex; flex-direction: column; align-self: flex-start;">
            <button type="button"
                    style="width:100%; display:flex; align-items:center; gap:10px; padding:14px 18px; background:rgba(255,255,255,0.18); border:none; border-radius:14px; color:#ffffff; font-size:14px; font-weight:600; font-family:inherit; cursor:default; text-align:left; pointer-events:none; white-space:nowrap;"
                    tabindex="-1"
                    aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Adicionar outra lista</span>
            </button>
        </div>


    </div>


</main>

<!-- Modal de Criação Rápida de Demanda -->
<div th:replace="~{fragments/modal-demanda :: modalDemanda}"></div>

<!-- Modal de Detalhes da Demanda (Sobreposto ao Quadro) -->
<div id="modal-detalhe-demanda"
     class="modal-backdrop modal-backdrop-detail"
     role="dialog"
     aria-modal="true"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-detail" id="modal-detail-dialog-content">
        <!-- Injetado dinamicamente via AJAX -->
    </div>
</div>

<!-- Script Principal -->
<script th:src="@{/js/app.js}"></script>

</body>
</html>
