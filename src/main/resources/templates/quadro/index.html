<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quadro de Demandas')}"></head>
<body class="body-board-view">

<!-- Link acessível para pular direto ao conteúdo principal -->
<a class="skip-to-content" href="#conteudo-quadro">Pular para o quadro de demandas</a>

<!-- Barra Superior Escura Translúcida -->
<div th:replace="~{fragments/header :: topbar}"></div>

<!-- Container Principal do Quadro Kanban -->
<main id="conteudo-quadro" class="board-canvas" role="main">

    <!-- Container de Alertas / Notificações Toast -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Indicador de Filtro Ativo (se houver pesquisa aplicada) -->
    <div th:if="${temFiltro}" class="filter-indicator-bar" role="status">
        <span class="filter-indicator-text">
            Filtro ativo:
            <strong th:if="${filtroTermo != null and !#strings.isEmpty(filtroTermo)}" th:text="'«' + ${filtroTermo} + '»'">termo</strong>
        </span>
        <a th:href="@{/quadro}" class="btn-clear-filter" aria-label="Remover filtros e exibir todas as demandas">
            ✕ Limpar filtro
        </a>
    </div>

    <!-- ── Lista Horizontal de Colunas Kanban ────────────────────────── -->
    <div class="board-columns-track" id="board-columns-track" th:attr="data-projeto-id=${projetoId}" aria-label="Colunas do Quadro Kanban">


        <!-- Itera sobre as colunas usando o fragmento coluna -->
        <th:block th:each="coluna : ${colunas}">
            <div th:replace="~{fragments/coluna :: coluna(${coluna}, ${demandas.get(coluna) != null ? demandas.get(coluna) : {}})}"></div>
        </th:block>

        <!-- Adição funcional de uma nova lista -->
        <div class="add-list-column" id="container-add-lista">
            <button type="button"
                    id="btn-add-lista-trigger"
                    class="btn-add-list-trigger"
                    aria-expanded="false"
                    aria-controls="form-add-lista"
                    aria-label="Adicionar outra lista ao quadro">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Adicionar outra lista</span>
            </button>

            <form id="form-add-lista"
                  class="add-list-form"
                  method="post"
                  th:action="@{/colunas}"
                  th:object="${colunaForm}"
                  novalidate>

                <div class="add-list-input-wrapper">
                    <label class="sr-only" for="input-nome-lista">Nome da nova lista</label>
                    <input id="input-nome-lista"
                           class="add-list-input"
                           type="text"
                           th:field="*{nome}"
                           maxlength="50"
                           autocomplete="off"
                           placeholder="Digite o nome da lista..."
                           aria-describedby="add-list-error-msg"
                           aria-required="true">
                    <span id="add-list-error-msg" class="add-list-error-msg" role="alert" aria-live="polite"></span>
                </div>
                <div class="add-list-actions">
                    <button type="submit" class="btn-add-list-submit">Adicionar Lista</button>
                    <button type="button"
                            id="btn-cancelar-add-lista"
                            class="btn-add-list-cancel"
                            aria-label="Cancelar criação da lista"
                            title="Cancelar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </form>
        </div>



    </div>


</main>

<!-- Modal de Criação Rápida de Demanda -->
<div th:replace="~{fragments/modal-demanda :: modalDemanda}"></div>

<!-- Modal de Detalhes da Demanda (Sobreposto ao Quadro) -->
<div id="modal-detalhe-demanda"
     class="modal-backdrop modal-backdrop-detail"
     role="dialog"
     aria-modal="true"
     aria-label="Detalhes da demanda"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-detail" id="modal-detail-dialog-content">
        <!-- Injetado dinamicamente via AJAX -->
    </div>
</div>

<!-- ── Visualizador Ampliado de Imagens (Lightbox estilo Trello) ────────── -->
<div id="image-viewer-lightbox" class="image-viewer-backdrop is-hidden" role="dialog" aria-modal="true" aria-label="Visualizador de imagem ampliada" onclick="window.fecharVisualizadorImagem()">
    <!-- Botão Fechar no Canto Superior Direito -->
    <button type="button" class="btn-viewer-close" onclick="event.stopPropagation(); window.fecharVisualizadorImagem()" aria-label="Fechar visualizador" title="Fechar (Esc)">✕</button>

    <!-- Botão Navegação Anterior -->
    <button type="button" id="btn-viewer-prev" class="btn-viewer-nav btn-viewer-prev is-hidden" onclick="event.stopPropagation(); window.navegarVisualizadorImagem(-1)" aria-label="Imagem anterior" title="Anterior (←)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>

    <!-- Área Central da Imagem -->
    <div class="image-viewer-content" onclick="event.stopPropagation()">
        <img id="viewer-img-element" src="" alt="Imagem ampliada" class="viewer-image" />
    </div>

    <!-- Botão Navegação Próxima -->
    <button type="button" id="btn-viewer-next" class="btn-viewer-nav btn-viewer-next is-hidden" onclick="event.stopPropagation(); window.navegarVisualizadorImagem(1)" aria-label="Próxima imagem" title="Próxima (→)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>

    <!-- Rodapé com Informações e Ações do Anexo (Imagem 3 de referência) -->
    <div class="image-viewer-footer" onclick="event.stopPropagation()">
        <div class="viewer-info">
            <h3 id="viewer-file-title" class="viewer-title">Nome do arquivo.png</h3>
            <div id="viewer-file-meta" class="viewer-meta">Adicionado há pouco • 1 de 1</div>
        </div>
        <div class="viewer-actions">
            <a id="viewer-action-open" href="#" target="_blank" rel="noopener noreferrer" class="btn-viewer-action">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                <span>Abrir em uma nova guia</span>
            </a>
            <a id="viewer-action-download" href="#" download class="btn-viewer-action">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Baixar</span>
            </a>
            <button type="button" id="viewer-action-capa" class="btn-viewer-action" onclick="window.toggleCapaVisualizador()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span id="viewer-action-capa-text">Tornar capa</span>
            </button>
            <button type="button" id="viewer-action-delete" class="btn-viewer-action btn-viewer-action-danger" onclick="window.excluirAnexoVisualizador()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <span>Excluir</span>
            </button>
        </div>
    </div>
</div>

<!-- Modal de Autenticação Supabase -->
<div th:replace="~{fragments/auth-modal :: authModal}"></div>




<!-- Script Principal -->
<script th:src="@{/js/app.js?v=20260901_final}"></script>


















</body>
</html>
