<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Nexioo Demand</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" th:href="@{/css/auth.css?v=20260901_supa}">
    <!-- SDK Oficial do Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script th:src="@{/js/auth.js?v=20260901_supa}"></script>
</head>
<body class="auth-page-body">

<!-- ── Circuit Corner Graphics (Exact Match to Reference Image) ──────────── -->
<svg class="circuit-node circuit-node-tl" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="80" height="45" rx="6" fill="#16181c" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="120" cy="32.5" r="3" fill="#ffffff"/>
    <path d="M 90 32.5 L 210 32.5 L 210 170" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>

<svg class="circuit-node circuit-node-tr" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="150" y="10" width="80" height="45" rx="6" fill="#16181c" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="120" cy="32.5" r="3" fill="#ffffff"/>
    <path d="M 150 32.5 L 30 32.5 L 30 170" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>

<svg class="circuit-node circuit-node-bl" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="125" width="80" height="45" rx="6" fill="#16181c" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="120" cy="147.5" r="3" fill="#ffffff"/>
    <path d="M 90 147.5 L 210 147.5 L 210 10" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>

<svg class="circuit-node circuit-node-br" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="150" y="125" width="80" height="45" rx="6" fill="#16181c" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="120" cy="147.5" r="3" fill="#ffffff"/>
    <path d="M 150 147.5 L 30 147.5 L 30 10" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>

<!-- ── Central Auth Card Container ──────────────────────────────────────── -->
<main class="auth-container">
    <div class="auth-card">

        <!-- Circular Brand Logo Badge -->
        <div class="auth-logo-badge" title="Nexioo Demand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="4" height="16" rx="1.5" fill="#00E6A8"/>
                <rect x="10" y="4" width="4" height="11" rx="1.5" fill="#00E6A8" fill-opacity="0.85"/>
                <rect x="17" y="4" width="4" height="6" rx="1.5" fill="#00E6A8" fill-opacity="0.6"/>
            </svg>
        </div>



        <!-- Header Titles -->
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">
            Already have an account? <a th:href="@{/login}">Login</a>
        </p>

        <!-- Error Alert Banner -->
        <div id="auth-error-banner" class="auth-error-alert" role="alert"></div>

        <!-- Signup Form -->
        <form class="auth-form" onsubmit="window.handleSignupSubmit(event)">

            <!-- Email Input -->
            <div class="input-group-icon">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                </span>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="email address"
                       required
                       autocomplete="email"
                       aria-label="Email address">
            </div>

            <!-- Password Input -->
            <div class="input-group-icon">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       required
                       minlength="6"
                       autocomplete="new-password"
                       aria-label="Password">
            </div>

            <!-- Confirm Password Input -->
            <div class="input-group-icon">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <input type="password"
                       id="confirm-password"
                       name="confirm-password"
                       placeholder="Confirm Password"
                       required
                       minlength="6"
                       autocomplete="new-password"
                       aria-label="Confirm Password">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-signup" class="btn-auth-submit">
                <span>Sign up</span>
            </button>

        </form>

    </div>
</main>


<script>
    function handleSignupSubmit(e) {
        e.preventDefault();
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirm-password').value;
        var btn = document.getElementById('btn-signup');
        var banner = document.getElementById('auth-error-banner');

        banner.style.display = 'none';

        if (password !== confirmPassword) {
            banner.textContent = 'As senhas não coincidem.';
            banner.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span>Creating account...</span>';

        var params = new URLSearchParams();
        params.append('email', email);
        params.append('password', password);

        fetch('/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: params.toString()
        })
        .then(function(res) {
            if (!res.ok) throw new Error('Erro ao criar conta.');
            window.location.href = '/projetos';
        })

        .catch(function(err) {
            banner.textContent = err.message || 'Erro ao criar conta.';
            banner.style.display = 'block';
        })
        .finally(function() {
            btn.disabled = false;
            btn.innerHTML = '<span>Sign up</span>';
        });
    }
</script>


</body>
</html>
