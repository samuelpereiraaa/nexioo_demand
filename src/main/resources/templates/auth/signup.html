<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Nexioo Demand</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" th:href="@{/css/auth.css?v=20260901_supa}">
    <!-- SDK Oficial do Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script th:src="@{/js/auth.js?v=20260901_supa}"></script>
</head>
<body class="auth-page-body">

<!-- ── Circuit Corner Graphics (Exact Match to Reference Image) ──────────── -->
<svg class="circuit-node circuit-node-tl" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="80" height="45" rx="6" fill="#16181c" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="120" cy="32.5" r="3" fill="#ffffff"/>
    <path d="M 90 32.5 L 210 32.5 L 210 170" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>

<svg class="circuit-node circuit-node-tr" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="150" y="10" width="80" height="45" rx="6" fill="#16181c" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="120" cy="32.5" r="3" fill="#ffffff"/>
    <path d="M 150 32.5 L 30 32.5 L 30 170" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>

<svg class="circuit-node circuit-node-bl" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="125" width="80" height="45" rx="6" fill="#16181c" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="120" cy="147.5" r="3" fill="#ffffff"/>
    <path d="M 90 147.5 L 210 147.5 L 210 10" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>

<svg class="circuit-node circuit-node-br" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="150" y="125" width="80" height="45" rx="6" fill="#16181c" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="120" cy="147.5" r="3" fill="#ffffff"/>
    <path d="M 150 147.5 L 30 147.5 L 30 10" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>

<!-- ── Central Auth Card Container ──────────────────────────────────────── -->
<main class="auth-container">
    <div class="auth-card">

        <!-- Circular Spinner Logo Badge -->
        <div class="auth-logo-badge">
            <div class="auth-logo-spinner"></div>
        </div>

        <!-- Header Titles -->
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">
            Already have an account? <a th:href="@{/login}">Login</a>
        </p>

        <!-- Error Alert Banner -->
        <div id="auth-error-banner" class="auth-error-alert" role="alert"></div>

        <!-- Signup Form -->
        <form class="auth-form" onsubmit="window.handleSignupSubmit(event)">

            <!-- Email Input -->
            <div class="input-group-icon">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                </span>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="email address"
                       required
                       autocomplete="email"
                       aria-label="Email address">
            </div>

            <!-- Password Input -->
            <div class="input-group-icon">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       required
                       minlength="6"
                       autocomplete="new-password"
                       aria-label="Password">
            </div>

            <!-- Confirm Password Input -->
            <div class="input-group-icon">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <input type="password"
                       id="confirm-password"
                       name="confirm-password"
                       placeholder="Confirm Password"
                       required
                       minlength="6"
                       autocomplete="new-password"
                       aria-label="Confirm Password">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-signup" class="btn-auth-submit">
                <span>Sign up</span>
            </button>

        </form>

        <!-- OR Divider -->
        <div class="auth-divider">
            <span>OR</span>
        </div>

        <!-- Social Buttons Row (Apple, Google, X) -->
        <div class="social-buttons-row">
            <!-- Apple Button -->
            <button type="button" class="btn-social" aria-label="Sign up with Apple" title="Apple">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.83c.63-.77 1.06-1.84.94-2.91-.91.04-2.02.61-2.67 1.37-.58.67-1.09 1.76-.95 2.81 1.03.08 2.06-.5 2.68-1.27z"/>
                </svg>
            </button>

            <!-- Google Button -->
            <button type="button" class="btn-social" aria-label="Sign up with Google" title="Google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
            </button>

            <!-- X / Twitter Button -->
            <button type="button" class="btn-social" aria-label="Sign up with X" title="X (Twitter)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </button>
        </div>

    </div>
</main>

<script>
    function handleSignupSubmit(e) {
        e.preventDefault();
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirm-password').value;
        var btn = document.getElementById('btn-signup');
        var banner = document.getElementById('auth-error-banner');

        banner.style.display = 'none';

        if (password !== confirmPassword) {
            banner.textContent = 'Passwords do not match.';
            banner.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span>Creating account...</span>';

        window.supabaseAuth.signUp(email, password)
            .then(function(data) {
                if (data && data.session) {
                    window.location.href = '/projetos';
                } else {
                    banner.style.background = 'rgba(34, 197, 94, 0.15)';
                    banner.style.borderColor = 'rgba(34, 197, 94, 0.4)';
                    banner.style.color = '#4ade80';
                    banner.textContent = 'Conta criada com sucesso! Se a confirmação de e-mail estiver ativa no Supabase, confirme no seu e-mail ou desative a opção "Confirm email" no painel do Supabase.';
                    banner.style.display = 'block';
                }
            })
            .catch(function(err) {
                banner.style.background = 'rgba(239, 68, 68, 0.12)';
                banner.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                banner.style.color = '#fca5a5';
                banner.textContent = err.message || 'Error creating account.';
                banner.style.display = 'block';
            })

            .finally(function() {
                btn.disabled = false;
                btn.innerHTML = '<span>Sign up</span>';
            });
    }
</script>

</body>
</html>
