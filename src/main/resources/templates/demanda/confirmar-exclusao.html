<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Confirmar exclusão')}"></head>
<body class="body-subpage-view">

<a class="skip-to-content" href="#conteudo-confirmacao">Pular para a confirmação</a>

<div th:replace="~{fragments/header :: topbar}"></div>

<main id="conteudo-confirmacao" class="subpage-canvas" role="main">
    <div class="subpage-container container--narrow">

        <div class="glass-dialog-card" role="alertdialog" aria-modal="true" aria-labelledby="titulo-confirmacao">
            <div class="dialog-icon-danger" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>

            <h1 id="titulo-confirmacao" class="dialog-title">Confirmar exclusão</h1>

            <p class="dialog-text">Você está prestes a excluir permanentemente a seguinte demanda:</p>

            <p class="dialog-highlighted-item" th:text="'«' + ${demanda.titulo} + '»'">Nome da demanda</p>

            <p class="dialog-warning-text">Esta ação não poderá ser desfeita.</p>

            <div class="dialog-actions">
                <a th:href="@{/demandas/{id}(id=${demanda.id})}" class="btn btn-fantasma">
                    Cancelar
                </a>
                <form method="post" th:action="@{/demandas/{id}/excluir(id=${demanda.id})}">
                    <button type="submit" class="btn btn-perigo-destaque">
                        Sim, excluir definitivamente
                    </button>
                </form>
            </div>
        </div>

    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
